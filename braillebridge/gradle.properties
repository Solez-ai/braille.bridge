android.useAndroidX=true
kotlin.code.style=official
# 4GB heap: AGP 9 + Kotlin 2.2 + KSP 2.3.7 overflowed the old 2GB cap on cold CI runs
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
# Compile Kotlin inside the Gradle JVM: no second daemon JVM, no memory split,
# no daemon-spawn flakiness on CI (killed run #7 ~40s in)
kotlin.compiler.execution.strategy=in-process
