name: Build BrailleBridge Desktop (Windows)

on:
  push:
    branches: [ main ]
    paths:
      - 'braille-desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r braille-desktop/requirements.txt
          pip install pyinstaller

      - name: Run relay & unit tests
        run: python braille-desktop/test_relay.py

      - name: Build standalone Windows executable
        working-directory: braille-desktop
        run: |
          pyinstaller --noconfirm --onefile --windowed --name BrailleBridge --paths . main.py

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrailleBridge-Windows
          path: braille-desktop/dist/BrailleBridge.exe

      - name: Release Windows Executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: BrailleBridge Desktop (Windows)
          draft: false
          prerelease: false
          files: |
            braille-desktop/dist/BrailleBridge.exe
