name: Build BrailleBridge APK

# Builds the Android app in braillebridge/ and publishes the APK as a
# workflow artifact and as a GitHub Release package.
# NEVER build this app locally — push and let CI do it.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # manual "Run workflow" button on GitHub

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble and Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: braillebridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 9.3.1 (matches gradle/wrapper/gradle-wrapper.properties)
      # and caches dependencies between runs.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # The repo deliberately does not commit debug.keystore (see .gitignore),
      # but app/build.gradle.kts pins the debug signing config to it — so CI
      # generates an equivalent Android debug keystore before assembling.
      - name: Generate debug keystore
        run: >
          keytool -genkeypair -v -keystore debug.keystore
          -storepass android -keypass android -alias androiddebugkey
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      # tee captures full output so the failure step can grep the real error.
      # Kotlin compiles in-process (see gradle.properties) — single JVM, 4GB heap.
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build_output.txt | tail -n 60

      # Guarantees the REAL error is visible in the log even when Gradle's
      # summary is truncated.
      - name: Print error details on failure
        if: failure()
        run: |
          grep -n -E "error:|^e: |Exception|OutOfMemory|FAILED|Caused by" build_output.txt | head -60 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrailleBridge-debug-apk
          path: braillebridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BrailleBridge Mobile v1.0.${{ github.run_number }}
          body: |
            ### BrailleBridge Mobile Android Release (v1.0.${{ github.run_number }})

            Official Android release package for BrailleBridge — ESP32 Bluetooth Low Energy companion.

            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build**: `${{ github.run_number }}`

            #### Included features:
            - Bluetooth Low Energy (NUS) foreground proxy service with auto-reconnect
            - Student view with live 6-dot visualizer & Google Translate (all 128 languages)
            - Audio feedback & Text-to-Speech (TTS) for English & Bangla
            - Teacher multi-device dashboard with live per-student feeds & exam mode
            - Learner mode with Freeplay Playground & Chord Sequence Trainer
            - Auto-formatted document exports library (Room DB + .txt download)
            - Samin Yeasar teacher profile & live session statistics

            Download `app-debug.apk` below and install directly on your Android phone.
          files: braillebridge/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
