name: Build BrailleBridge APK

# Builds the Android app in braillebridge/ and publishes the APK as a
# workflow artifact. NEVER build this app locally — push and let CI do it.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # manual "Run workflow" button on GitHub

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: braillebridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 9.3.1 (matches gradle/wrapper/gradle-wrapper.properties)
      # and caches dependencies between runs.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # The repo deliberately does not commit debug.keystore (see .gitignore),
      # but app/build.gradle.kts pins the debug signing config to it — so CI
      # generates an equivalent Android debug keystore before assembling.
      - name: Generate debug keystore
        run: >
          keytool -genkeypair -v -keystore debug.keystore
          -storepass android -keypass android -alias androiddebugkey
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrailleBridge-debug-apk
          path: braillebridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
